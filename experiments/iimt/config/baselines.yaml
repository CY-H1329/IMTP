    mbart_tgt: ko_KR
  en-zh:
    marian: Helsinki-NLP/opus-mt-zh-en
    mbart_src: en_XX
    mbart_tgt: zh_CN
  en-ja:
    marian: Helsinki-NLP/opus-mt-jap-en
    mbart_src: en_XX
    mbart_tgt: ja_XX
